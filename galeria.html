<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria de caricaturas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;800&display=swap">
<style>
body{margin:0;background:#120a10;color:#fff1dc;font:15px/1.4 'Nunito',system-ui,sans-serif;padding:20px}
h1{font:2em 'Lilita One',sans-serif;color:#f2b33d;margin:0 0 4px} h2{font:1.4em 'Lilita One',sans-serif;color:#ffd77a;margin:24px 0 10px}
p{color:#cdb4c1;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.c{background:#1c0f19;border-radius:20px;padding:10px;text-align:center;box-shadow:0 0 0 1px rgba(255,215,122,.18) inset}
.c .m{width:120px;height:120px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 32%,#8a2348,#2a0a17 75%);display:grid;place-items:center;box-shadow:0 0 0 3px #f2b33d}
.c b{display:block;font:1.05em 'Lilita One',sans-serif;margin-top:8px}
.c small{color:#cdb4c1;font-size:.78em;display:block;min-height:3em}
</style>
<script src="visuais.js"></script>
<script src="caricatura.js"></script>
</head>
<body>
<h1>Galeria de caricaturas</h1>
<p>Os 100 nomes do leilão sem IA, desenhados a partir dos traços em visuais.json. Passe o olho e anote quem não ficou parecido.</p>
<div id="out"></div>
<script>
const grupos={'Futebol':['Neuer','Buffon','Taffarel','Dida','Marcos','Maldini','Beckenbauer','Cafu','Roberto Carlos','Lúcio','Zidane','Xavi','Modric','Kaká','Gilberto Silva','Pelé','Messi','Neymar','Romário','Adriano'],
'MMA':['José Aldo','Max Holloway','Conor McGregor','Volkanovski','Ilia Topuria','Khabib','Charles Oliveira','Islam Makhachev','Justin Gaethje','Dustin Poirier','Anderson Silva','Israel Adesanya','Georges St-Pierre','Sean Strickland','Vitor Belfort','Jon Jones','Francis Ngannou','Fedor Emelianenko','Daniel Cormier','Mark Hunt'],
'Filósofos':['Sócrates','Platão','Aristóteles','Diógenes','Epicuro','Tomás de Aquino','Santo Agostinho','Averróis','Maimônides','Guilherme de Ockham','Descartes','Kant','Nietzsche','Hobbes','Spinoza','Sartre','Simone de Beauvoir','Wittgenstein','Foucault','Hannah Arendt'],
'Personagens':['Hulk','Thor','Superman','Goku','Chapolin Colorado','Batman','Tony Stark','Light Yagami','Sherlock Holmes','Professor Xavier','Homem-Aranha','Naruto','Wolverine','Deadpool','Viúva Negra','Capitão América','Optimus Prime','Dumbledore','Aragorn','Gandalf'],
'Banda':['Freddie Mercury','Robert Plant','Renato Russo','Cazuza','Axl Rose','Jimi Hendrix','Jimmy Page','Slash','Eric Clapton','Kiko Loureiro','Paul McCartney','John Entwistle','Flea','Geddy Lee','Roger Waters','John Bonham','Dave Grohl','Neil Peart','Ringo Starr','Phil Collins']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('out').innerHTML=Object.entries(grupos).map(([g,ns])=>`<h2>${g}</h2><div class="g">${ns.map(n=>`<div class="c"><div class="m">${caricatura(n,104)}</div><b>${esc(n)}</b><small>${esc((VISUAIS[n]||{}).detalhe||'sem traços definidos')}</small></div>`).join('')}</div>`).join('');
</script>
</body>
</html>
